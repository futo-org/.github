name: Bug report
description: Report a bug
labels: ["bug"]
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected to happen, and what actually happened.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that triggers the bug. Say whether it fails every time or only sometimes.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell

  - type: textarea
    id: debugging
    attributes:
      label: Debugging done
      description: What you examined, and what you ruled out and how. Where the behavior breaks, for example a component, a code path or a commit that `git bisect` found. Report what you observed, not a fix.

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: If you found a way to avoid the bug without a change to the code of this project, describe it. Examples are a configuration change, an older pinned version or a manual step. If there is no workaround, leave this field empty.

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "v1.2.3"

  - type: dropdown
    id: ai-assistance
    attributes:
      label: AI assistance
      description: Did you use AI tools for any part of this issue? See the [AI Usage Policy](https://github.com/futo-org/.github/blob/main/CONTRIBUTING.md#ai-usage-policy).
      options:
        - "No"
        - "Yes, minimal: grammar fixes or small edits"
        - "Yes, substantive: AI wrote large parts of this issue or helped investigate it"
    validations:
      required: true

  - type: input
    id: ai-tools
    attributes:
      label: AI tools used
      description: If you used AI, name the tools and say what they did.
