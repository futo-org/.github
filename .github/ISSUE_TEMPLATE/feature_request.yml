name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
type: feature
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Desired behavior
      description: How does it work from the point of view of a user? If it helps, sketch the configuration or the API that you want to use. Do not describe how to implement it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: ai-assistance
    attributes:
      label: AI assistance
      description: Did you use AI tools for any part of this request? See the [AI Usage Policy](https://github.com/futo-org/.github/blob/main/CONTRIBUTING.md#ai-usage-policy).
      options:
        - "No"
        - "Yes, minimal: grammar fixes or small edits"
        - "Yes, substantive: AI wrote large parts of this request or helped research it"
    validations:
      required: true

  - type: input
    id: ai-tools
    attributes:
      label: AI tools used
      description: If you used AI, name the tools and say what they did.
